services:
  docs:
    build: .
    ports:
      - "7517:80"
    restart: unless-stopped

  dev:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    profiles: ["dev"]

volumes:
  dev_node_modules:
