<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>freshGram: плагины</title>
    <link rel="icon" type="image/svg+xml" href="/freshgram-wheel.svg" />
    <script>
      // Ключ совпадает с STORAGE_KEY в src/theme.ts; тема применяется до загрузки бандла
      try {
        const theme = localStorage.getItem('freshgram-docs-theme');
        if (theme === 'light' || theme === 'dark' || theme === 'system') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
